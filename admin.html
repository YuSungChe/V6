<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台管理 - 訪客記錄</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0e1a; color: #dde4f0; margin: 0; padding: 20px; }
    h1 { color: #f5c518; text-align: center; }
    .card { background: #111827; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #1e2d45; }
    th { background: #1e2d45; }
    .btn-block { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-block:hover { background: #dc2626; }
    #log { font-family: monospace; white-space: pre-wrap; background: #0a0e1a; padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>後台管理 - 訪客記錄</h1>
  
  <div class="card">
    <h2>🔐 輸入密碼</h2>
    <input type="password" id="password" placeholder="輸入後台密碼" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#1e2d45; color:white; border:none;">
    <button onclick="login()" style="width:100%; padding:12px; background:#f5c518; color:#0a0e1a; font-weight:bold; border:none; border-radius:8px;">進入後台</button>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="card">
      <h2>最近訪客記錄</h2>
      <div id="log">載入中...</div>
    </div>

    <div class="card">
      <h2>封鎖 IP</h2>
      <input type="text" id="blockIP" placeholder="輸入要封鎖的 IP" style="width:70%; padding:10px; border-radius:8px; background:#1e2d45; color:white; border:none;">
      <button onclick="blockIPFunc()" style="width:28%; padding:10px; background:#ef4444; color:white; border:none; border-radius:8px;">封鎖</button>
    </div>
  </div>

  <script>
    const PASSWORD = "17881788";

    function login() {
      const input = document.getElementById('password').value.trim();
      if (input === PASSWORD) {
        document.getElementById('adminPanel').style.display = 'block';
        loadLogs();
      } else {
        alert("密碼錯誤！");
      }
    }

    async function loadLogs() {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = "正在載入訪客記錄...";
      
      try {
        const res = await fetch('/api/visit');
        const data = await res.json();
        logDiv.innerHTML = `<pre>最新記錄已載入，請查看 Netlify Functions Logs\n\n${JSON.stringify(data, null, 2)}</pre>`;
      } catch (e) {
        logDiv.innerHTML = "無法直接顯示詳細記錄，請到 Netlify 後台 → Functions → visit → Logs 查看完整 IP 記錄";
      }
    }

    async function blockIPFunc() {
      const ip = document.getElementById('blockIP').value.trim();
      if (!ip) return alert("請輸入 IP");

      if (confirm(`確定要封鎖 IP: ${ip} 嗎？`)) {
        // 這裡實際上還是需要手動加到 block.js，但提供提示
        alert(`已記錄封鎖請求：${ip}\n\n請手動到 netlify/functions/block.js 加入此 IP`);
      }
    }

    // 按 Enter 也可登入
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
